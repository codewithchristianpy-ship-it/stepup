{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Profile — StepUp{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card p-4">
                <h3 class="mb-1">Your profile</h3>
                <p class="text-muted mb-4">Role: <strong>{{ profile.get_role_display }}</strong></p>
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Save changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
