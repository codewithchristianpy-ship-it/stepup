services:
  - type: web
    name: stepup
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn stepup_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: stepup-db
          property: connectionString
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin

databases:
  - name: stepup-db
    databaseName: stepup
    user: stepup_user