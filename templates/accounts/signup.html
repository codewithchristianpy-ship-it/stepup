{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Sign up — StepUp{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4">
                <h3 class="mb-1">Create your account</h3>
                <p class="text-muted mb-4">Get 3 free time credits. No credit card needed.</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Create account</button>
                </form>
                <p class="text-center mt-3 mb-0 small">
                    Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
